; PlatformIO project for Suuret Muinaiset V2 firmware (Teensy 4.0)
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 9600
;
; Audio, SD, SPI and Watchdog_t4 ship with the Teensy core, so only the
; third-party RTClib needs declaring. If Watchdog_t4 is not found on your
; setup, either add it to lib_deps or set USE_WATCHDOG 0 in config.h.

[platformio]
src_dir = .

[env:teensy40]
platform      = teensy
board         = teensy40
framework     = arduino
build_flags   = -std=gnu++17
monitor_speed = 9600
lib_deps =
    adafruit/RTClib
